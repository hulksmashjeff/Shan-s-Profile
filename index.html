  <style>
    body {
      background-color: #0A0A0A;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Smooth view transitions */
    .view-transition {
      animation: fadeSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animated equalizer bars for Spotify preview bar */
    @keyframes eqBounce {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .eq-bar-1 { animation: eqBounce 0.7s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBounce 0.5s ease-in-out infinite 0.15s; }
    .eq-bar-3 { animation: eqBounce 0.8s ease-in-out infinite 0.3s; }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0A0A;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    *, *::before, *::after {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    max-width: 100%;
    overflow-x: hidden;
    background: #0f0f0f;
    color: #ffffff;
}

/* Lock ALL icons / SVGs so they never blow up */
svg {
    width: 22px !important;
    height: 22px !important;
    max-width: 22px !important;
    max-height: 22px !important;
    flex-shrink: 0;
}

.header-socials img,
.social-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
}

/* Keep bento thumbnails compact instead of full-screen tall */
.bento-card img:not(.social-icon),
.card-thumb,
.card-bg {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
}

/* Mobile layout */
@media (max-width: 768px) {
    .container {
        width: 100%;
        padding: 0 16px;
    }

    header h1 {
        font-size: 1.75rem;
        line-height: 1.15;
    }

    .bento-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .bento-card {
        padding: 16px;
        min-height: auto;
    }

    .bento-card img:not(.social-icon),
    .card-thumb,
    .card-bg {
        height: 140px;
    }
}

    /* ==========================================================================

    const VALID_VIEWS = ['home', 'photography', 'gaming', 'spotify', 'manhwa', 'projects'];

    let gameFilter = 'All';
    let manhwaFilter = 'All';

    let filteredPhotosCache = [];

    function getHashView() {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      return VALID_VIEWS.includes(hash) ? hash : 'home';
    }

    function navigateTo(view) {
      currentView = VALID_VIEWS.includes(view) ? view : 'home';
      const targetHash = currentView === 'home' ? '' : `#${currentView}`;
      if (window.location.hash !== targetHash) {
        history.pushState(null, '', targetHash || window.location.pathname);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    window.addEventListener('hashchange', () => {
      currentView = getHashView();
      renderApp();
    });

    window.addEventListener('popstate', () => {
      currentView = getHashView();
      renderApp();
    });

            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${SITE_DATA.songs.map((song, idx) => {
              const isPlaying = playingSongId === song.id;
              return `
                <div 
                  onclick="toggleSongPreview('${song.id}')" 
                  class="group bg-card hover:bg-cardHover border ${isPlaying ? 'border-emerald-500/50' : 'border-borderSubtle hover:border-borderHover'} rounded-2xl p-4 flex items-center justify-between gap-4 transition cursor-pointer"
                >
                  <div class="flex items-center gap-3.5 min-w-0">
                    <div class="relative w-14 h-14 rounded-xl overflow-hidden border border-borderSubtle shrink-0">
                      <img 
                        src="${escapeHtml(song.cover)}" 
                        alt="${escapeHtml(song.title)}" 
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                      />
                      <div class="absolute inset-0 bg-black/40 flex items-center justify-center ${isPlaying ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} transition-opacity">
                        <span class="text-xs text-white font-bold">${isPlaying ? '❚❚' : '▶'}</span>
                      </div>
                    </div>
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-[11px] text-mutedText">0${idx + 1}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] bg-obsidian border border-borderSubtle text-zinc-300">${escapeHtml(song.mood)}</span>
                      </div>
                      <h3 class="text-sm font-semibold ${isPlaying ? 'text-emerald-400' : 'text-white'} truncate mt-1">${escapeHtml(song.title)}</h3>
                      <p class="text-xs text-mutedText truncate">${escapeHtml(song.artist)} · ${escapeHtml(song.album)}</p>
                    </div>
                  </div>
                  <span class="text-xs font-mono text-mutedText shrink-0">${escapeHtml(song.duration)}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function toggleSongPreview(songId) {
      const playerBar = document.getElementById('spotify-player-bar');
      if (playingSongId === songId) {
        stopSongPreview();
        return;
      }
      playingSongId = songId;
      const song = SITE_DATA.songs.find(s => s.id === songId);
      if (song) {
        document.getElementById('player-cover').src = song.cover;
        document.getElementById('player-title').textContent = song.title;
        document.getElementById('player-artist').textContent = `${song.artist} — ${song.album}`;
        document.getElementById('player-spotify-link').href = song.spotifyUrl || 'https://open.spotify.com';
        playerBar.classList.remove('hidden');
      }
      renderApp();
    }

    function stopSongPreview() {
      playingSongId = null;
      document.getElementById('spotify-player-bar').classList.add('hidden');
      renderApp();
    }

    /* ==========================================================================
       5. EXPANDED MANHWA / READING LIST SUB-PAGE (#manhwa)
       ========================================================================== */
    function renderManhwaPage() {
      const tabs = ['All', 'Reading', 'Completed', 'Masterpiece'];
      const filtered = manhwaFilter === 'All'
        ? SITE_DATA.manhwa
        : SITE_DATA.manhwa.filter(m => m.status === manhwaFilter);

      return `
        <div class="view-transition space-y-6">
          <div class="sticky top-0 z-30 bg-obsidian/90 backdrop-blur-md flex items-center justify-between gap-4 py-4 border-b border-borderSubtle">
            <div class="flex items-center gap-3">
              <button 
                onclick="navigateTo('home')" 
                class="px-3.5 py-2 rounded-xl bg-card hover:bg-cardHover border border-borderSubtle hover:border-borderHover text-xs font-medium text-zinc-200 hover:text-white transition cursor-pointer"
              >
                ← Back
              </button>
              <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-wider uppercase text-white">MANHWA & READING LIST</h1>
                <p class="text-xs text-mutedText hidden sm:block">All-time favorites and weekly chapters</p>
              </div>
            </div>
            <span class="px-3 py-1 rounded-full bg-card border border-borderSubtle font-mono text-xs text-mutedText">
              ${filtered.length} series
            </span>
          </div>

          <!-- Filter Pills -->
          <div class="flex flex-wrap items-center gap-2">
            ${tabs.map(tab => {
              const active = manhwaFilter === tab;
              return `
                <button 
                  onclick="setManhwaFilter('${tab}')" 
                  class="px-3.5 py-1.5 rounded-full text-xs font-medium transition cursor-pointer ${
                    active 
                      ? 'bg-white text-black font-semibold' 
                      : 'bg-card border border-borderSubtle text-mutedText hover:text-white hover:border-borderHover'
                  }"
                >
                  ${tab}
                </button>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${filtered.map(item => `
              <div class="bg-card hover:bg-cardHover border border-borderSubtle hover:border-borderHover rounded-2xl p-4 flex gap-4 transition">
                <img 
                  src="${escapeHtml(item.cover)}" 
                  alt="${escapeHtml(item.title)}" 
                  class="w-24 h-36 rounded-xl object-cover border border-borderSubtle shrink-0"
                />
                <div class="flex flex-col justify-between min-w-0">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-obsidian border border-borderSubtle text-zinc-300">
                        ${escapeHtml(item.status)}
                      </span>
                      <span class="text-[11px] font-mono text-emerald-400">${escapeHtml(item.rating)}</span>
                    </div>
                    <h3 class="text-base font-bold text-white mt-1.5">${escapeHtml(item.title)}</h3>
                    <p class="text-[11px] text-mutedText mt-0.5">${escapeHtml(item.genre)}</p>
                    <p class="text-xs text-zinc-400 mt-2 line-clamp-3 leading-relaxed">${escapeHtml(item.summary)}</p>
                  </div>
                  <p class="text-[11px] font-mono text-mutedText mt-2">${escapeHtml(item.chapters)}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function setManhwaFilter(tab) {
      manhwaFilter = tab;
      renderApp();
    }

    /* ==========================================================================
       6. EXPANDED PROJECTS & FITNESS SUB-PAGE (#projects)
       ========================================================================== */
    function renderProjectsPage() {
      const projectsList = SITE_DATA.projects.filter(p => p.category === 'Project');
      const fitnessList = SITE_DATA.projects.filter(p => p.category === 'Fitness');

      return `
        <div class="view-transition space-y-8">
          <div class="sticky top-0 z-30 bg-obsidian/90 backdrop-blur-md flex items-center justify-between gap-4 py-4 border-b border-borderSubtle">
            <div class="flex items-center gap-3">
              <button 
                onclick="navigateTo('home')" 
                class="px-3.5 py-2 rounded-xl bg-card hover:bg-cardHover border border-borderSubtle hover:border-borderHover text-xs font-medium text-zinc-200 hover:text-white transition cursor-pointer"
              >
                ← Back
              </button>
              <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-wider uppercase text-white">PROJECTS & FITNESS</h1>
                <p class="text-xs text-mutedText hidden sm:block">Side builds, tools, and personal training milestones</p>
              </div>
            </div>
          </div>

          <!-- Coding & Creative Projects Section -->
          <div class="space-y-3">
            <h2 class="text-xs font-bold tracking-widest uppercase text-mutedText">SOFTWARE & HARDWARE BUILDS</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${projectsList.map(proj => `
                <div class="bg-card hover:bg-cardHover border border-borderSubtle hover:border-borderHover rounded-2xl p-5 transition flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2">
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-obsidian border border-borderSubtle text-zinc-300">
                        ${escapeHtml(proj.tag)}
                      </span>
                      <span class="text-xs font-mono text-emerald-400">${escapeHtml(proj.metric)}</span>
                    </div>
                    <h3 class="text-base font-bold text-white mt-3">${escapeHtml(proj.title)}</h3>
                    <p class="text-xs sm:text-sm text-zinc-400 mt-2 leading-relaxed">${escapeHtml(proj.desc)}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-borderSubtle/60 flex items-center justify-between gap-2">
                    <div class="flex flex-wrap gap-1.5">
                      ${(proj.stack || []).map(tech => `
                        <span class="px-2 py-0.5 rounded-md bg-obsidian border border-borderSubtle font-mono text-[10px] text-zinc-300">${escapeHtml(tech)}</span>
                      `).join('')}
                    </div>
                    ${proj.url ? `<a href="${escapeHtml(proj.url)}" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-white hover:underline shrink-0">View ↗</a>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Fitness Milestones Section -->
          <div class="space-y-3">
            <h2 class="text-xs font-bold tracking-widest uppercase text-mutedText">FITNESS & TRAINING</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${fitnessList.map(fit => `
                <div class="bg-card hover:bg-cardHover border border-borderSubtle hover:border-borderHover rounded-2xl p-5 transition flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2">
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-obsidian border border-borderSubtle text-zinc-300">
                        ${escapeHtml(fit.tag)}
                      </span>
                      <span class="text-xs font-mono text-emerald-400">${escapeHtml(fit.metric)}</span>
                    </div>
                    <h3 class="text-base font-bold text-white mt-3">${escapeHtml(fit.title)}</h3>
                    <p class="text-xs sm:text-sm text-zinc-400 mt-2 leading-relaxed">${escapeHtml(fit.desc)}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-borderSubtle/60 flex flex-wrap gap-1.5">
                    ${(fit.stack || []).map(pill => `
                      <span class="px-2 py-0.5 rounded-md bg-obsidian border border-borderSubtle font-mono text-[10px] text-zinc-300">${escapeHtml(pill)}</span>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       LIGHTBOX & GAME DETAIL MODALS
       ========================================================================== */
    function openLightbox(index) {
      currentLightboxIndex = index;
      updateLightboxContent();
      document.getElementById('lightbox-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function updateLightboxContent() {
      const photo = filteredPhotosCache[currentLightboxIndex];
      if (!photo) return;
      document.getElementById('lightbox-img').src = photo.url;
      document.getElementById('lightbox-title').textContent = photo.title;
      document.getElementById('lightbox-location').textContent = photo.location;
      document.getElementById('lightbox-category').textContent = photo.category;
      document.getElementById('lightbox-exif').textContent = photo.exif;
    }

    function navigateLightbox(dir, event) {
      if (event) event.stopPropagation();
      if (!filteredPhotosCache.length) return;
      currentLightboxIndex = (currentLightboxIndex + dir + filteredPhotosCache.length) % filteredPhotosCache.length;
      updateLightboxContent();
    }

    function closeLightbox(event, force = false) {
      if (force || event.target.id === 'lightbox-modal') {
        document.getElementById('lightbox-modal').classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    function openGameModal(gameId) {
      const game = SITE_DATA.games.find(g => g.id === gameId);
      if (!game) return;
      document.getElementById('game-modal-img').src = game.url;
      document.getElementById('game-modal-title').textContent = game.title;
      document.getElementById('game-modal-status').textContent = game.status;
      document.getElementById('game-modal-rating').textContent = game.rating;
      document.getElementById('game-modal-genre').textContent = game.genre;
      document.getElementById('game-modal-hours').textContent = game.hours;
      document.getElementById('game-modal-platform').textContent = game.platform || 'PC';
      document.getElementById('game-modal-notes').textContent = game.notes || 'No notes added yet.';
      document.getElementById('game-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeGameModal(event, force = false) {
      if (force || event.target.id === 'game-modal') {
        document.getElementById('game-modal').classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    // Keyboard Shortcuts (ESC to close modals, Left/Right arrows in Lightbox)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox(null, true);
        closeGameModal(null, true);
      } else if (!document.getElementById('lightbox-modal').classList.contains('hidden')) {
        if (e.key === 'ArrowRight') navigateLightbox(1);
        if (e.key === 'ArrowLeft') navigateLightbox(-1);
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial Render
    window.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
